<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="search">
        <div class="label">Inofficial FICSIT Quick Search</div>
        <div class="row">
          <label>
            <input id="input" type="text" autocomplete="off" autofocus spellcheck="false" placeholder="1+1" size="45">
          </label>
          <label>
            <button id="button">X</button>
          </label>
        </div>
        <div id="results"></div>
      </div>
    </main>
  </body>
</html>
